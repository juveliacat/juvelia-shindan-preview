function ask(id){var n=Q[id],step=hist.length;var h=hud('STAGE '+step+'/'+tot())+'<div class="jvs-win"><span class="jvs-name">JUVELIA</span><p class="jvs-say"></p><p class="jvs-sayen"></p></div><div class="jvs-menu" style="'+(n.grid?'grid-template-columns:1fr 1fr':'')+'">';
 n.o.forEach(function(o,i){h+='<button class="jvs-opt'+(i?'':' sel')+'" data-go="'+o[1]+'">'+o[0]+en(o[0])+(o[2]?'<small>'+o[2]+'<br>'+tr(o[2])+'</small>':'')+'</button>'});
 draw(h+'</div><div class="jvs-nav"><button class="jvs-link" data-back="1">◀ もどる<span class="jvs-en">Back</span></button><button class="jvs-link" data-home="1">さいしょから<span class="jvs-en">From the top</span></button></div>',LINES[id],tr(LINES[id]));}
function show(k){var r=res(k);var h=hud('CLEAR')+'<p class="jvs-get">GET!</p><div class="jvs-win"><span class="jvs-name">TREASURE</span><p class="jvs-say"></p><p class="jvs-sayen"></p></div><div class="jvs-grid">';
 if(!r.L.length)h+='<p style="grid-column:1/3;text-align:center;font-size:13px">ただいま準備中。お気軽にお問い合わせください。<br><span class="jvs-en">Coming soon. Feel free to contact us.</span></p>';
 r.L.forEach(function(p,i){h+='<div class="jvs-card" style="'+(i>=6?'display:none;':'')+'animation-delay:'+(0.4+(i%6)*0.15)+'s"><img loading="lazy" src="'+p.img+'" alt="'+esc(p.n)+'"><p>'+esc(p.n)+'</p><a class="jvs-btn" href="'+B+'/products/'+p.h+'">詳しく見る<span class="jvs-en">View details</span></a></div>'});
 h+='</div>'+(r.L.length>6?'<button class="jvs-more" data-more="1" style="width:calc(100% - 8px);font:inherit;cursor:pointer">▶ もっと見る（のこり'+(r.L.length-6)+'こ）<span class="jvs-en">See more ('+(r.L.length-6)+' left)</span></button>':'');
 draw(h+'<div class="jvs-nav"><button class="jvs-link" data-back="1">◀ もどる<span class="jvs-en">Back</span></button><button class="jvs-link" data-home="1">もういちど遊ぶ<span class="jvs-en">Play again</span></button></div>',"「"+r.t+"」を見つけた！"+(r.note?" "+r.note:""),"You found "+r.te+"!"+(r.note?" "+tr(r.note):""));}
function go(x){hist.push(x);x.indexOf("r:")==0?show(x.slice(2)):ask(x)}
app.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 if(b.dataset.more){var hid=[].filter.call(app.querySelectorAll('.jvs-card'),function(c){return c.style.display=='none'});hid.slice(0,6).forEach(function(c){c.style.display=''});var n=hid.length-6;if(n>0)b.innerHTML='▶ もっと見る（のこり'+n+'こ）<span class="jvs-en">See more ('+n+' left)</span>';else b.remove();return;}
 if(b.dataset.go)go(b.dataset.go);else if(b.dataset.home)home();else if(b.dataset.back){hist.pop();var p=hist.pop();p?go(p):home();}});
home();window.jvsGo=function(a){home();a.forEach(go)};
})();
</script>
</div></body></html>
